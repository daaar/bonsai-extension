<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Bonsai favicon: the viewer splash's BonsaiMark (EmptyState.tsx) recomposed
       for tab sizes, on the same dark rounded chip as the action icon
       (scripts/render-icons.mjs). Unlike the splash's stroked line-art, the
       foliage pads are SOLID color chips (object blue / string salmon / number
       green, glyph inked dark) — at 16px only color mass survives downscaling,
       and stroked pads grey out. Colors are the dark theme's concrete values
       (tokens.ts); a favicon can't read the live CSS vars. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26282c"/>
      <stop offset="1" stop-color="#17181a"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="url(#bg)"/>
  <!-- wood: trunk + two side branches -->
  <g fill="none" stroke="#b4b4b4" stroke-linecap="round">
    <path d="M31 50 C29 45.5 28.2 42.5 30 39 C31.8 35.5 32.8 32 32.4 27.5" stroke-width="3.2"/>
    <path d="M29.5 41 C25 39 20.5 37 16.5 35" stroke-width="2.4"/>
    <path d="M31.8 34.5 C36.5 33.5 42 32.2 47.5 30.8" stroke-width="2.4"/>
  </g>
  <!-- boolean bud (on the right branch, like the splash's on-wood buds) -->
  <circle cx="38.5" cy="33.1" r="2.1" fill="#569cd6"/>
  <!-- string pad (left branch) -->
  <g transform="translate(8.3 21.3) scale(1.05)">
    <rect x="1.6" y="1.6" width="12.8" height="12.8" rx="3.4" fill="#ce9178"/>
    <path d="M6.3 5.4v1.9c0 .9-.4 1.5-1.1 1.9M9.7 5.4v1.9c0 .9-.4 1.5-1.1 1.9" fill="none" stroke="#17181a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- number pad (right branch) -->
  <g transform="translate(42.3 15.6) scale(1.05)">
    <rect x="1.6" y="1.6" width="12.8" height="12.8" rx="3.4" fill="#b5cea8"/>
    <path d="M7 4.9l-.7 6.2M9.7 4.9L9 11.1M5.6 6.9h5.3M5.1 9.1h5.3" fill="none" stroke="#17181a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- apex object pad: the { } brand badge -->
  <g transform="translate(19.2 3.2) scale(1.6)">
    <rect x="1.6" y="1.6" width="12.8" height="12.8" rx="3.4" fill="#9cdcfe"/>
    <path d="M6.9 4.7c-1 0-1.4.5-1.4 1.3v1c0 .6-.3.9-.9.9.6 0 .9.3.9.9v1c0 .8.4 1.3 1.4 1.3M9.1 4.7c1 0 1.4.5 1.4 1.3v1c0 .6.3.9.9.9-.6 0-.9.3-.9.9v1c0 .8-.4 1.3-1.4 1.3" fill="none" stroke="#17181a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- pot -->
  <g stroke="#b4b4b4" stroke-width="1.8" fill="#3d4046">
    <rect x="20.5" y="49" width="23" height="4" rx="1.8"/>
    <path d="M23 53 L24.7 58.6 Q25 59.6 26.2 59.6 H37.8 Q39 59.6 39.3 58.6 L41 53 Z"/>
  </g>
</svg>
